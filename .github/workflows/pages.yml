name: Deploy reviewed LAV brand on varnazov.com
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: DEPLOY drlav/lavmind-site
        type: string
        required: true
  # One owner-authorized brand correction only; remove after its verified release.
  push:
    branches: [main]
permissions: {}
concurrency:
  group: lavmind-site-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'drlav/lavmind-site' && github.ref == 'refs/heads/main' &&
      github.actor == 'drlav' && github.triggering_actor == 'drlav' &&
      ((github.event_name == 'workflow_dispatch' && vars.PAGES_SITE_DEPLOY_ENABLED == 'true' &&
        inputs.confirmation == 'DEPLOY drlav/lavmind-site') ||
       (github.event_name == 'push' && github.event.before == '553d0f0cdc0634d731b2cc5b3a9a579efe39695c'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require first attempt, current main and exact approved brand tree
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          current=$(gh api repos/drlav/lavmind-site/git/ref/heads/main --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:site)" = 5f2a93971449dd52e9c90c40f49495024d40d8ae
          python3 .github/scripts/verify_site.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Confirm exact domain, Actions source and HTTPS without changes
        run: |
          gh api repos/drlav/lavmind-site/pages > "$RUNNER_TEMP/pages.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pages.json').read_text())
          print(json.dumps({k: data.get(k) for k in ('cname', 'html_url', 'build_type', 'https_enforced', 'protected_domain_state')}))
          if (data.get('cname') != 'varnazov.com'
              or data.get('html_url', '').rstrip('/') != 'https://varnazov.com'
              or data.get('build_type') != 'workflow'
              or data.get('https_enforced') is not True):
              raise SystemExit('exact_https_domain_required')
          PY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Package only manifest files including public security.txt
        run: python3 .github/scripts/package_pages.py "$RUNNER_TEMP/artifact.tar"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lav-brand-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck current main and Pages domain after environment approval
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          current=$(gh api repos/drlav/lavmind-site/git/ref/heads/main --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          test "$(gh api repos/drlav/lavmind-site/pages --jq .cname)" = varnazov.com
          python3 .github/scripts/verify_site.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy only the exact artifact from this run and attempt
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        with:
          artifact_name: lav-brand-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify live HTTPS bytes, brand resources, www and custom 404
        run: python3 .github/scripts/verify_site.py --live
