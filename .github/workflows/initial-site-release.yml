name: Authorized first site release from main (exact tree, expires 2026-10-30)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.github/workflows/initial-site-release.yml]
  push:
    branches: [main]
    paths: [.github/workflows/initial-site-release.yml]
permissions: {}
concurrency:
  group: lavmind-site-pages
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'drlav/lavmind-site' && github.actor == 'drlav' &&
      github.triggering_actor == 'drlav' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        github.event.before == '8d2a4f8bfc4b66d04bc218960a75e4903bed4d2e') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == 'drlav/lavmind-site' &&
        github.event.pull_request.head.ref == 'release/main-only-site-20261029'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep this release restricted to exactly the authorized static tree
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD:site)" = ac0904821dc9d2a015ce65243a563664fe86e966
          test "$(git ls-tree -r --name-only HEAD site | wc -l)" = 9
          test "$(git rev-parse HEAD:site/index.html)" = 8d6f3e8f01685f593e9c568a187d2b1380bb394b
          python3 - <<'PY'
          from datetime import UTC, datetime
          if datetime.now(UTC) >= datetime(2026, 10, 30, 12, tzinfo=UTC):
              raise SystemExit('initial_release_authorization_expired')
          PY
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF" = refs/heads/main
            test "$(gh api repos/drlav/lavmind-site/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read previous deployment refusal without changing environment protections
        run: |
          gh api repos/drlav/lavmind-site/check-runs/123322050020/annotations \
            --jq '.[] | {annotation_level, message}'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check workflow syntax
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml
      - name: Require the actual custom domain, Actions source, and enforced HTTPS
        run: |
          gh api repos/drlav/lavmind-site/pages > "$RUNNER_TEMP/pages.json"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pages.json').read_text())
          print(json.dumps({key: data.get(key) for key in (
              'cname', 'html_url', 'build_type', 'https_enforced',
              'protected_domain_state', 'https_certificate'
          )}, sort_keys=True))
          if (data.get('cname') != 'varnazov.com'
              or data.get('html_url', '').rstrip('/') != 'https://varnazov.com'
              or data.get('build_type') != 'workflow'
              or data.get('https_enforced') is not True):
              raise SystemExit('exact_https_custom_domain_not_confirmed')
          PY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload the approved nine-file site only from actual main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          name: initial-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site/
          retention-days: 7
  deploy:
    needs: verify
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'drlav/lavmind-site' && github.actor == 'drlav' &&
      github.triggering_actor == 'drlav' &&
      github.event.before == '8d2a4f8bfc4b66d04bc218960a75e4903bed4d2e'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recheck current main and exact domain after environment approval
        run: |
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(gh api repos/drlav/lavmind-site/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          test "$(gh api repos/drlav/lavmind-site/pages --jq .cname)" = varnazov.com
          python3 - <<'PY'
          from datetime import UTC, datetime
          if datetime.now(UTC) >= datetime(2026, 10, 30, 12, tzinfo=UTC):
              raise SystemExit('initial_release_authorization_expired')
          PY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy the one-time owner-authorized artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: initial-site-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify actual HTTPS bytes, www redirect, and 404 without republishing
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import time
          import urllib.error
          import urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          def get(url):
              request = urllib.request.Request(url, headers={
                  'Cache-Control': 'no-cache', 'User-Agent': 'LAV-site-release-verification'
              })
              try:
                  with opener.open(request, timeout=15) as response:
                      return response.status, response.headers, response.read(100000)
              except urllib.error.HTTPError as error:
                  return error.code, error.headers, error.read(100000)
          expected = {
              '/': '033464ace60443a4e1eccaff4cd058d5137d9aa65ed8b6ce0431adff70d5aaf2',
              '/mind/': 'ba127e39b4a127f2d847fbf4587037433acdfc75b4e218feed71cab74c5793fa',
              '/mind/series/daily_ai/': 'f4b5e1a09fd7aa89fefc5636f8d9387f45032de0924dcc07eff67cb96307a1da',
              '/mind/series/research_review/': 'b2f11ba03ddbec0e6a6cf23cdd20c311991ab588fba4a75b460abc304440d288',
          }
          remaining = dict(expected)
          for attempt in range(10):
              for path, digest in list(remaining.items()):
                  status, headers, body = get('https://varnazov.com' + path)
                  if status == 200 and headers.get_content_type() == 'text/html' and hashlib.sha256(body).hexdigest() == digest:
                      print(json.dumps({'url': 'https://varnazov.com' + path,
                                        'https': 'verified', 'status': 200,
                                        'exact_sha256': digest}))
                      del remaining[path]
              if not remaining:
                  break
              time.sleep(6)
          if remaining:
              raise SystemExit('deployment_exists_but_cdn_exact_version_not_yet_confirmed')
          status, headers, _ = get('https://www.varnazov.com/')
          if status not in (301, 308) or headers.get('Location') != 'https://varnazov.com/':
              raise SystemExit('www_redirect_not_confirmed')
          print(json.dumps({'www_https': 'verified', 'redirect_status': status,
                            'location': headers.get('Location')}))
          status, _, _ = get('https://varnazov.com/mind/LAV-9999/')
          if status != 404:
              raise SystemExit('real_404_required')
          print(json.dumps({'missing_page_status': 404, 'telegram_sending_performed': False,
                            'first_site_release_confirmed': True}))
          PY
